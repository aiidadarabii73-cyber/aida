services:
  api:
    image: node:22
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - api_node_modules:/workspace/backend/node_modules
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=dev-jwt-secret-nestora-homes-2024
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
    command: ["sh", "-ec", "npm install && npx prisma db push && node prisma/seed.js && exec npx nodemon --watch src src/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: on-failure

  web:
    image: node:22-slim
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - web_node_modules:/workspace/frontend/node_modules
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX:-}
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: on-failure

volumes:
  api_node_modules:
  web_node_modules:
